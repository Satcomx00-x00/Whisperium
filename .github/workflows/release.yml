name: Release

# Triggered on every push to main. Computes the next semver from Conventional
# Commits; if there are release-worthy changes, bumps manifests, tags, generates
# CHANGELOG, then builds cross-platform installers and publishes a GitHub Release.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Tag & changelog
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Determine next version
        id: bump
        run: |
          latest="$(git describe --tags --abbrev=0 2>/dev/null || echo '')"
          # Seed a local v0.0.0 on the root commit so git-cliff can bump from it
          # when the repo has never been tagged. This tag is never pushed.
          if [ -z "$latest" ]; then
            git tag v0.0.0 "$(git rev-list --max-parents=0 HEAD)"
          fi
          range="HEAD"
          [ -n "$latest" ] && range="$latest..HEAD"
          subjects="$(git log "$range" --format='%s')"
          # Only release when feat/fix or any breaking change landed.
          if echo "$subjects" | grep -qE '^(feat|fix)(\([^)]+\))?!?:' \
             || echo "$subjects" | grep -qE '^[a-z]+(\([^)]+\))?!:'; then
            next="$(git cliff --config cliff.toml --bumped-version | sed 's/^v//')"
          else
            next=""
          fi
          echo "Latest tag: ${latest:-<none>} | Next: ${next:-<none>}"
          if [ -z "$next" ] || [ "v$next" = "$latest" ]; then
            echo "No release-worthy commits — skipping."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true"  >> "$GITHUB_OUTPUT"
            echo "version=$next"  >> "$GITHUB_OUTPUT"
            echo "tag=v$next"     >> "$GITHUB_OUTPUT"
          fi

      - name: Generate CHANGELOG
        if: steps.bump.outputs.released == 'true'
        run: git cliff --config cliff.toml --tag "${{ steps.bump.outputs.tag }}" --output CHANGELOG.md

      - name: Bump version in manifests
        if: steps.bump.outputs.released == 'true'
        run: |
          v="${{ steps.bump.outputs.version }}"
          node -e "
            const fs = require('fs');
            ['package.json','packages/stt-core/package.json','src-tauri/tauri.conf.json'].forEach(f => {
              const p = JSON.parse(fs.readFileSync(f,'utf8'));
              p.version = '$v';
              fs.writeFileSync(f, JSON.stringify(p, null, 2) + '\n');
            });
          "
          sed -i '0,/^version = ".*"/s//version = "'"$v"'"/' src-tauri/Cargo.toml

      - name: Commit, tag and push
        if: steps.bump.outputs.released == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json packages/stt-core/package.json \
                  src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore(release): ${{ steps.bump.outputs.tag }} [skip ci]"
          git tag -a "${{ steps.bump.outputs.tag }}" -m "${{ steps.bump.outputs.tag }}"
          git push origin HEAD:main
          git push origin "${{ steps.bump.outputs.tag }}"

  build:
    name: Build · ${{ matrix.name }}
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-22.04
            args: ''
            rust-targets: ''
          - name: macos-universal
            runner: macos-latest
            args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - name: windows-x64
            runner: windows-latest
            args: ''
            rust-targets: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install Tauri system dependencies (Linux)
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build & publish (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_COMMIT_SHA: ${{ github.sha }}
          VITE_BUILD_DATE: ${{ needs.version.outputs.tag }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: 'whisperium ${{ needs.version.outputs.tag }}'
          releaseBody: 'See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.'
          releaseDraft: false
          prerelease: false
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}
